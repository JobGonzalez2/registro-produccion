<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EggTrack Pro - Gestión de Producción</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: "#43a800",
                        "primary-dark": "#007832",
                        accent: "#3DB0BF",
                        "bg-light": "#f8faf7",
                        "bg-dark": "#0f170a"
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Public Sans', sans-serif; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-bg-light dark:bg-bg-dark text-slate-800 dark:text-slate-100 transition-colors duration-300">

    <header class="sticky top-0 z-50 border-b border-primary/10 bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md px-6 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-primary p-2 rounded-xl shadow-lg shadow-primary/20">
                    <span class="material-icons text-white">egg</span>
                </div>
                <div>
                    <h1 class="text-lg font-extrabold leading-none text-primary-dark dark:text-primary">RF-NU-016</h1>
                    <p class="text-[10px] uppercase tracking-tighter font-bold text-slate-500">SENA Cauca • Producción</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="document.documentElement.classList.toggle('dark')" class="p-2 rounded-full hover:bg-primary/10 text-slate-500">
                    <span class="material-icons">dark_mode</span>
                </button>
                <div class="h-10 w-10 rounded-full border-2 border-primary p-0.5">
                    <img src="https://ui-avatars.com/api/?name=Admin+Sena&background=43a800&color=fff" class="rounded-full" alt="Perfil">
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 space-y-6">
        
        <div class="flex flex-wrap justify-between items-end gap-4 border-b border-primary/10 pb-6">
            <div class="flex flex-col gap-2">
                <p class="text-3xl font-black tracking-tight">Registro de Producción</p>
                <div class="flex items-center gap-2 text-primary-dark dark:text-primary/80">
                    <span class="material-icons text-sm">calendar_today</span>
                    <p id="fecha-display" class="text-base font-semibold">Viernes, 24 de Mayo, 2024</p>
                </div>
            </div>
            <button id="btn-calendario" class="flex items-center justify-center rounded-xl h-11 px-6 bg-primary text-white text-sm font-bold transition-transform active:scale-95 shadow-lg shadow-primary/20 hover:bg-primary-dark">
                <span class="material-icons mr-2 text-sm">event</span> Cambiar Fecha
            </button>
            <input type="date" id="input-fecha-oculto" class="hidden">
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-8">
                <div class="bg-white dark:bg-zinc-900 rounded-2xl border border-primary/10 shadow-xl overflow-hidden">
                    <form class="p-6 space-y-8">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-slate-500 uppercase">Procedencia / Galpón</label>
                                <select class="w-full rounded-xl border-slate-200 dark:border-zinc-700 bg-slate-50 dark:bg-zinc-800 focus:ring-primary focus:border-primary">
                                    <option>Galpón de Postura 01</option>
                                    <option>Galpón de Postura 02</option>
                                </select>
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-slate-500 uppercase">Responsable</label>
                                <input type="text" value="Marcos R." class="w-full rounded-xl border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-950 font-semibold" disabled>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <p class="text-xs font-black text-primary uppercase tracking-widest">Tamaño de Huevo (Unidades)</p>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div class="bg-slate-50 dark:bg-zinc-800 p-4 rounded-2xl border border-slate-100 dark:border-zinc-700">
                                    <label class="text-[10px] font-bold text-slate-400 uppercase">Tipo S</label>
                                    <input type="number" placeholder="0" class="w-full bg-transparent border-none text-2xl font-black p-0 focus:ring-0">
                                </div>
                                <div class="bg-slate-50 dark:bg-zinc-800 p-4 rounded-2xl border border-slate-100 dark:border-zinc-700">
                                    <label class="text-[10px] font-bold text-slate-400 uppercase">Tipo M</label>
                                    <input type="number" placeholder="0" class="w-full bg-transparent border-none text-2xl font-black p-0 focus:ring-0">
                                </div>
                                <div class="bg-slate-50 dark:bg-zinc-800 p-4 rounded-2xl border border-slate-100 dark:border-zinc-700">
                                    <label class="text-[10px] font-bold text-slate-400 uppercase">Tipo L</label>
                                    <input type="number" placeholder="0" class="w-full bg-transparent border-none text-2xl font-black p-0 focus:ring-0">
                                </div>
                                <div class="bg-slate-50 dark:bg-zinc-800 p-4 rounded-2xl border border-slate-100 dark:border-zinc-700">
                                    <label class="text-[10px] font-bold text-slate-400 uppercase">Tipo XL</label>
                                    <input type="number" placeholder="0" class="w-full bg-transparent border-none text-2xl font-black p-0 focus:ring-0">
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 border-t border-slate-100 dark:border-zinc-800 pt-6">
                            <div class="flex items-center gap-3 p-3 rounded-xl border border-green-100 bg-green-50 dark:bg-green-900/10 dark:border-green-900/30">
                                <span class="material-icons text-green-600">verified</span>
                                <div>
                                    <p class="text-[10px] font-bold uppercase text-green-700">Buenos</p>
                                    <input type="number" class="w-full bg-transparent border-none p-0 font-bold focus:ring-0" value="0">
                                </div>
                            </div>
                            <div class="flex items-center gap-3 p-3 rounded-xl border border-orange-100 bg-orange-50 dark:bg-orange-900/10 dark:border-orange-900/30">
                                <span class="material-icons text-orange-600">report_problem</span>
                                <div>
                                    <p class="text-[10px] font-bold uppercase text-orange-700">Rotos</p>
                                    <input type="number" class="w-full bg-transparent border-none p-0 font-bold focus:ring-0" value="0">
                                </div>
                            </div>
                            <div class="flex items-center gap-3 p-3 rounded-xl border border-red-100 bg-red-50 dark:bg-red-900/10 dark:border-red-900/30">
                                <span class="material-icons text-red-600">dangerous</span>
                                <div>
                                    <p class="text-[10px] font-bold uppercase text-red-700">Descartes</p>
                                    <input type="number" class="w-full bg-transparent border-none p-0 font-bold focus:ring-0" value="0">
                                </div>
                            </div>
                        </div>

                        <div class="flex flex-col sm:flex-row gap-4 pt-4">
                            <button type="submit" class="flex-1 bg-primary hover:bg-primary-dark text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-primary/20 transition-all active:scale-95">
                                <span class="material-icons">save</span> GUARDAR REGISTRO
                            </button>
                            <button type="reset" class="px-8 py-4 bg-slate-100 dark:bg-zinc-800 rounded-xl font-bold text-slate-500 hover:bg-slate-200 transition-colors">Limpiar</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-4">
                <div class="bg-white dark:bg-zinc-900 rounded-2xl border border-primary/10 shadow-sm p-5 space-y-4">
                    <h3 class="font-bold flex items-center gap-2 text-sm">
                        <span class="material-icons text-primary text-sm">inventory_2</span>
                        Resumen del Lote
                    </h3>
                    <div class="space-y-3">
                        <div class="p-4 rounded-xl bg-slate-50 dark:bg-zinc-800 border-l-4 border-primary">
                            <p class="text-[10px] text-slate-500 font-bold uppercase">Estado Operativo</p>
                            <p class="text-sm font-bold">Producción en curso</p>
                            <div class="w-full h-1.5 bg-slate-200 dark:bg-zinc-700 rounded-full mt-2">
                                <div class="h-full bg-primary w-2/3 rounded-full"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // LÓGICA DEL CALENDARIO
        const btnCalendario = document.getElementById('btn-calendario');
        const inputFecha = document.getElementById('input-fecha-oculto');
        const fechaDisplay = document.getElementById('fecha-display');

        // Al hacer clic en el botón, abrir el selector de fecha nativo
        btnCalendario.addEventListener('click', () => {
            inputFecha.showPicker();
        });

        // Actualizar el texto cuando cambie la fecha
        inputFecha.addEventListener('change', (e) => {
            const fechaSeleccionada = new Date(e.target.value + 'T00:00:00');
            const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            
            // Formatear: "Martes, 17 de Febrero, 2026"
            let fechaFormateada = fechaSeleccionada.toLocaleDateString('es-ES', opciones);
            
            // Capitalizar la primera letra
            fechaFormateada = fechaFormateada.charAt(0).toUpperCase() + fechaFormateada.slice(1);
            
            fechaDisplay.innerText = fechaFormateada;

            // Feedback visual de carga
            fechaDisplay.classList.add('animate-pulse');
            setTimeout(() => fechaDisplay.classList.remove('animate-pulse'), 500);
        });

        // Prevenir scroll en inputs numéricos
        document.querySelectorAll('input[type="number"]').forEach(item => {
            item.addEventListener('wheel', (e) => e.preventDefault());
        });
    </script>
</body>
</html>
